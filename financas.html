<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Assistente Financeiro</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #f8f9fa; }
    #chat { height: 300px; overflow-y: auto; padding: 10px; background: #fff; border-radius: 8px; border: 1px solid #ddd; }
    .msg { margin: 5px; padding: 10px; border-radius: 15px; max-width: 70%; }
    .user { background-color: #d1ecf1; align-self: flex-end; }
    .bot { background-color: #d4edda; align-self: flex-start; }
    #chat { display: flex; flex-direction: column; }
    .card { margin-top: 20px; }
  </style>
</head>
<body class="container py-4">

  <h1 class="text-center mb-4">💰 Assistente Financeiro</h1>

  <!-- Chat -->
  <div class="card">
    <div class="card-header">Chat</div>
    <div class="card-body">
      <div id="chat"></div>
      <div class="input-group mt-3">
        <input id="input" type="text" class="form-control" placeholder="Digite seu gasto, dívida, parcela ou meta...">
        <button class="btn btn-primary" onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </div>

  <!-- Relatório -->
  <div class="card">
    <div class="card-header">Relatório Consolidado</div>
    <div class="card-body">
      <button class="btn btn-success mb-3" onclick="listarRelatorio()">Atualizar Relatório</button>
      <ul id="relatorio" class="list-group"></ul>
    </div>
  </div>

  <!-- Gráficos -->
  <div class="card">
    <div class="card-header">Gráficos</div>
    <div class="card-body">
      <canvas id="graficoGastos"></canvas>
      <canvas id="graficoDividas" class="mt-4"></canvas>
    </div>
  </div>

  <script>
    // CONFIGURAÇÃO DO FIREBASE (substitua pelas suas credenciais)
    const firebaseConfig = {
      apiKey: "AIzaSyCt8rWuKVi6S8cG1GUpa1MGfOGLz_5m-UM",
      authDomain: "mapeamentocigarros.firebaseapp.com",
      projectId: "mapeamentocigarros",
      storageBucket: "mapeamentocigarros.appspot.com",
      messagingSenderId: "911298596636",
      appId: "1:911298596636:web:12b5fa79299936e40b34d9"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.textContent = (sender === "user" ? "Você: " : "Bot: ") + text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";

      let resposta = "";
      if (text.toLowerCase().includes("gastei")) {
        resposta = await registrarGasto(text);
      } else if (text.toLowerCase().includes("dívida") || text.toLowerCase().includes("cartão")) {
        resposta = await registrarDivida(text);
      } else if (text.toLowerCase().includes("parcela")) {
        resposta = await registrarParcela(text);
      } else if (text.toLowerCase().includes("meta")) {
        resposta = await registrarMeta(text);
      } else {
        resposta = "Não entendi. Você pode registrar um gasto, dívida, parcela ou meta.";
      }

      addMessage(resposta, "bot");
    }

    async function registrarGasto(text) {
      const valorMatch = text.match(/\d+/);
      const valor = valorMatch ? parseFloat(valorMatch[0]) : 0;
      let categoria = "outros";
      if (text.includes("mercado")) categoria = "supermercado";
      if (text.includes("almoço") || text.includes("jantar")) categoria = "alimentacao";

      await db.collection("gastos").add({
        valor: valor,
        categoria: categoria,
        descricao: text,
        data: new Date()
      });
      return `Registrei um gasto de R$${valor} em ${categoria}.`;
    }

    async function registrarDivida(text) {
      const valorMatch = text.match(/\d+/);
      const valor = valorMatch ? parseFloat(valorMatch[0]) : 0;
      let tipo = "cartao_credito";
      if (text.includes("empréstimo")) tipo = "emprestimo";

      await db.collection("dividas").add({
        saldo_atual: valor,
        tipo: tipo,
        descricao: text,
        data: new Date()
      });
      return `Registrei uma dívida de R$${valor} (${tipo}).`;
    }

    async function registrarParcela(text) {
      const valorMatch = text.match(/\d+/g);
      let valorParcela = valorMatch ? parseFloat(valorMatch[0]) : 0;
      let parcelasTotais = valorMatch && valorMatch[1] ? parseInt(valorMatch[1]) : 1;

      await db.collection("parcelas").add({
        valor_parcela: valorParcela,
        parcelas_totais: parcelasTotais,
        parcelas_pagas: 0,
        produto: text,
        data_inicio: new Date()
      });
      return `Registrei uma compra parcelada: ${parcelasTotais}x de R$${valorParcela}.`;
    }

    async function registrarMeta(text) {
      const valorMatch = text.match(/\d+/);
      const valorMeta = valorMatch ? parseFloat(valorMatch[0]) : 0;

      await db.collection("metas").add({
        valor_meta: valorMeta,
        valor_atual: 0,
        descricao: text,
        prazo: new Date(new Date().setMonth(new Date().getMonth() + 6)),
        status: "em andamento"
      });
      return `Registrei uma meta financeira de R$${valorMeta}.`;
    }

    async function listarRelatorio() {
      const relatorio = document.getElementById("relatorio");
      relatorio.innerHTML = "";

      const gastosSnap = await db.collection("gastos").get();
      let totalGastos = 0;
      let categorias = {};
      gastosSnap.forEach(doc => {
        const g = doc.data();
        totalGastos += g.valor;
        categorias[g.categoria] = (categorias[g.categoria] || 0) + g.valor;
        const li = document.createElement("li");
        li.className = "list-group-item";
        li.textContent = `Gasto: R$${g.valor} (${g.categoria}) - ${g.descricao}`;
        relatorio.appendChild(li);
      });

      const dividasSnap = await db.collection("dividas").get();
      let totalDividas = 0;
      let tiposDivida = {};
      dividasSnap.forEach(doc => {
        const d = doc.data();
        totalDividas += d.saldo_atual;
        tiposDivida[d.tipo] = (tiposDivida[d.tipo] || 0) + d.saldo_atual;
        const li = document.createElement("li");
        li.className = "list-group-item";
        li.textContent = `Dívida: R$${d.saldo_atual} (${d.tipo}) - ${d.descricao}`;
        relatorio.appendChild(li);
      });

      const liResumo = document.createElement("li");
      liResumo.className = "list-group-item active";
      liResumo.textContent = `Resumo: Total de gastos = R$${totalGastos}, Total de dívidas = R$${totalDividas}`;
      relatorio.appendChild(liResumo);

      // Gráfico de gastos por categoria
      const ctxGastos = document.getElementById("graficoGastos").getContext("2d");
      new Chart(ctxGastos, {
        type: "pie",
        data: {
          labels: Object.keys(categorias),
          datasets: [{
            data: Object.values(categorias),
            backgroundColor: ["#FF6384
